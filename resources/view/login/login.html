<div class="col-lg-5">
    <div class="card shadow-lg border-0 rounded-lg mt-3">
        <div class="text-center my-3 px-3">
            <img src="{{URL}}/resources/assets/imgs/logo.png" alt="Well Soluções Ambientais" class="login-logo mb-2" width="160" />
            <p class="text-muted small mb-0">Painel Administrativo</p>
        </div>
        <div class="card-header">
            <h3 class="text-center font-weight-light">Entrar</h3>
        </div>
        <div class="card-body">
            {{status}}
            <form method="post">
                {{csrf_field}}
                <div class="form-floating mb-3">
                    <input class="form-control" name="email" type="email" placeholder="nome@email.com" required />
                    <label>E-mail</label>
                </div>
                <div class="form-floating mb-3">
                    <input class="form-control" name="senha" type="password" placeholder="******" required />
                    <label>Senha</label>
                </div>
                <div class="d-flex align-items-center justify-content-end mt-4 mb-0">
                    <button type="submit" class="btn btn-primary">Entrar</button>
                </div>
            </form>
        </div>
    </div>
</div>
