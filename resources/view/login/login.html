<div class="col-11 col-sm-9 col-md-6 col-lg-4 mx-auto">
    <div class="card shadow-lg border-0 rounded-lg mt-3 well-login-card">
        <div class="text-center login-brand">
            <img src="{{URL}}/resources/assets/imgs/logo.png" alt="Well Soluções Ambientais" class="login-logo mb-1" />
            <p class="text-muted small mb-0">Painel Administrativo</p>
        </div>
        <div class="card-header">
            <h3 class="text-center font-weight-light">Entrar</h3>
        </div>
        <div class="card-body">
            {{status}}
            <form method="post">
                {{csrf_field}}
                <div class="form-floating mb-2">
                    <input class="form-control" name="email" type="email" placeholder="nome@email.com" required />
                    <label>E-mail</label>
                </div>
                <div class="form-floating mb-2">
                    <input class="form-control" name="senha" type="password" placeholder="******" required />
                    <label>Senha</label>
                </div>
                <div class="d-flex align-items-center justify-content-between mt-3 mb-0">
                    <a href="{{URL}}/gerador/login" class="small">Portal do gerador</a>
                    <button type="submit" class="btn btn-primary btn-sm">Entrar</button>
                </div>
            </form>
        </div>
    </div>
</div>
