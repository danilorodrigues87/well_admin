<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1B5E20" />
    <title>{{title}}</title>
    <link rel="icon" href="{{URL}}/resources/assets/imgs/favicon.png" type="image/png" />
    <link rel="manifest" href="{{URL}}/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="{{URL}}/resources/assets/imgs/logo.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Well Ops" />
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('well-eco-theme');
                var t = saved === 'dark' || saved === 'light'
                    ? saved
                    : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-bs-theme', t);
            } catch (e) {
                document.documentElement.setAttribute('data-bs-theme', 'light');
            }
        })();
    </script>
    <link href="{{URL}}/resources/css/styles.css" rel="stylesheet" />
    <link href="{{URL}}/resources/css/panel-theme.css" rel="stylesheet" />
    <link href="{{URL}}/resources/css/panel-mobile.css?v=20260917" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.12.4/dist/sweetalert2.min.css">
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="{{URL}}/resources/js/url-base.js"></script>
</head>
<body class="sb-nav-fixed {{body_class}}" data-current-module="{{current_slug}}">
    <nav class="sb-topnav navbar navbar-expand navbar-dark bg-dark">
        <a class="navbar-brand well-brand ps-3" href="{{URL}}/painel">
            <img src="{{URL}}/resources/assets/imgs/logo.png" alt="Well Soluções Ambientais" class="well-brand-logo" width="36" height="36" />
            <span class="well-brand-text">Well S.A.</span>
        </a>
        <button class="btn btn-link btn-sm order-1 order-lg-0 me-4 me-lg-0" id="sidebarToggle" type="button" aria-label="Abrir menu"><i class="fas fa-bars"></i></button>
        <ul class="navbar-nav ms-auto me-3 me-lg-4">
            <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                    {{user}} <small class="text-muted">({{funcao}})</small>
                </a>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" href="#" id="btn-toggle-theme"><i class="fa-regular fa-moon me-1"></i> Tema escuro</a></li>
                    <li><hr class="dropdown-divider" /></li>
                    <li><a class="dropdown-item" href="{{URL}}/logout"><i class="fa-solid fa-arrow-right-from-bracket"></i> Sair</a></li>
                </ul>
            </li>
        </ul>
    </nav>
    <div id="layoutSidenav">
        {{menu}}
        <div id="layoutSidenav_content">
            <main>
                <div class="container-fluid px-4 py-4">
                    <div id="well-csrf-holder" class="d-none">{{csrf_field}}</div>
                    {{content}}
                </div>
            </main>
            <footer class="py-4 bg-dark text-white mt-auto">
                <div class="container-fluid px-4">
                    <div class="small text-muted">
                        &copy; Well Soluções Ambientais
                        <span class="mx-1">·</span>
                        Desenvolvido por <a href="https://xdtec.com.br" target="_blank" rel="noopener noreferrer" class="text-decoration-none link-light link-opacity-75 link-opacity-100-hover">XDTEC</a>
                    </div>
                </div>
            </footer>
        </div>
    </div>
    {{coletor_dock}}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{URL}}/resources/js/sidebarToggle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="{{URL}}/resources/js/well-ajax.js?v=20260916h"></script>
    {{scripts}}
    <script src="{{URL}}/resources/js/panel-theme.js"></script>
    <script src="{{URL}}/resources/js/panel-mobile.js?v=20260917"></script>
    <script src="{{URL}}/resources/js/pwa-install.js?v=20260917"></script>
</body>
</html>
