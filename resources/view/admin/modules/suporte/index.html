<div class="container-fluid px-4">
<h1 class="mt-4">Suporte</h1>
<ol class="breadcrumb mb-4"><li class="breadcrumb-item active">Chamados com a equipe Well</li></ol>
<div class="d-flex flex-wrap gap-2 align-items-center mb-3">
    <button type="button" class="btn btn-primary" id="btn-novo-chamado"><i class="fas fa-plus me-1"></i> Abrir chamado</button>
    <input type="search" class="form-control form-control-sm" id="filtro-busca" placeholder="Buscar…" style="max-width:220px">
    <select class="form-select form-select-sm" id="filtro-status" style="width:auto"><option value="">Todos status</option></select>
    <button type="button" class="btn btn-outline-secondary btn-sm" id="btn-atualizar-lista">Atualizar</button>
</div>
<div class="card shadow mb-4">
    <div class="card-header">Chamados</div>
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead><tr><th>Número</th><th>Categoria</th><th>Assunto</th><th>Status</th><th>Atualizado</th></tr></thead>
                <tbody id="tbody-chamados"><tr><td colspan="5" class="text-muted text-center py-4">Carregando…</td></tr></tbody>
            </table>
        </div>
    </div>
</div>
</div>
<div class="modal fade" id="modalNovoChamado" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Abrir chamado</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
        <div class="mb-3"><label class="form-label">Categoria</label><select class="form-select" id="novo-categoria"></select></div>
        <div class="mb-3"><label class="form-label">Assunto</label><input type="text" class="form-control" id="novo-assunto" maxlength="160"></div>
        <div class="mb-3"><label class="form-label">Mensagem</label><textarea class="form-control" id="novo-mensagem" rows="5"></textarea></div>
        <div class="mb-0"><label class="form-label">Print (opcional)</label><input type="file" class="form-control" id="novo-anexo" accept="image/*"></div>
    </div>
    <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button type="button" class="btn btn-primary" id="btn-enviar-chamado">Enviar</button></div>
</div></div></div>
<div class="modal fade" id="modalDetalheChamado" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content">
    <div class="modal-header"><div><h5 class="modal-title mb-0" id="det-titulo">Chamado</h5><small class="text-muted" id="det-meta"></small></div><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body"><div id="det-thread"></div>
        <div id="det-responder-box" class="mt-3 border-top pt-3">
            <textarea class="form-control mb-2" id="det-mensagem" rows="3" placeholder="Sua resposta…"></textarea>
            <input type="file" class="form-control mb-2" id="det-anexo" accept="image/*">
            <button type="button" class="btn btn-primary btn-sm" id="btn-responder-chamado">Enviar resposta</button>
            <button type="button" class="btn btn-outline-danger btn-sm ms-2 d-none" id="btn-fechar-chamado">Fechar chamado</button>
        </div>
        <p id="det-fechado-msg" class="text-muted d-none mt-3">Chamado finalizado.</p>
    </div>
</div></div></div>
<script>
window.SUPORTE_CATEGORIAS = {{categorias_json}};
window.SUPORTE_STATUS = {{status_json}};
</script>
