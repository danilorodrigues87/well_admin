<h1 class="mt-2">Planos</h1>
<ol class="breadcrumb mb-4"><li class="breadcrumb-item"><a href="{{URL}}/painel">Dashboard</a></li><li class="breadcrumb-item active">Planos</li></ol>
<div class="alert alert-info py-2"><small><i class="fas fa-info-circle me-1"></i> Cobrança mensal = <strong>valor fixo</strong> + excedentes (acima do saldo) − créditos de recicláveis (papelão, alumínio etc.).</small></div>
<div class="card mb-4">
    <div class="card-header d-flex justify-content-between"><span><i class="fas fa-file-contract me-1"></i> Planos de serviço</span><button class="btn btn-primary btn-sm" onclick="novoRegistro()"><i class="fas fa-plus"></i> Novo</button></div>
    <div class="card-body">
        <div id="barra-filtros-lista" class="row mb-3 crud-filters-row g-2">
            <div class="col-md-4"><input type="text" id="crud-busca" name="busca" class="form-control" placeholder="Buscar nome ou tipo..." /></div>
            <div class="col-md-2"><select name="ativo" class="form-select crud-filter"><option value="">Ativos</option><option value="1">Somente ativos</option><option value="0">Somente inativos</option></select></div>
        </div>
        <table class="table table-striped align-middle"><thead><tr><th>Plano</th><th>Valor/mês</th><th>Saldo resíduo</th><th>Valor exced.</th><th>Ações</th></tr></thead><tbody id="crud-tbody"></tbody></table>
        <div id="crud-pagination"></div>
    </div>
</div>
<div class="modal fade" id="crudModal"><div class="modal-dialog modal-xl"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Plano</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body"><form id="crud-form">{{csrf_field}}<input type="hidden" name="id" id="crud-id" value="0"/>
        <div class="row g-2">
            <div class="col-md-6"><label>Nome *</label><input class="form-control" name="nome" id="crud-nome" required/></div>
            <div class="col-md-3"><label>Valor mensal (R$) *</label><input class="form-control" name="valor_mensal" id="crud-valor_mensal" inputmode="decimal" placeholder="0,00"/></div>
            <div class="col-md-3"><label>Tipo</label><select class="form-select" name="tipo" id="crud-tipo"><option value="">—</option><option value="Plano padrão">Plano padrão</option><option value="Plano personalizado">Plano personalizado</option></select></div>
            <div class="col-md-2"><label>Coletas/mês</label><input class="form-control" name="coletas_mensais" id="crud-coletas_mensais" inputmode="decimal" placeholder="1" title="Cota mensal quando não usa período customizado"/></div>
            <div class="col-md-2"><label>Período (meses)</label><input class="form-control" name="coletas_periodo_meses" id="crud-coletas_periodo_meses" inputmode="numeric" placeholder="—" title="Ex.: 3 = trimestre"/></div>
            <div class="col-md-2"><label>Coletas no período</label><input class="form-control" name="coletas_por_periodo" id="crud-coletas_por_periodo" inputmode="numeric" value="1"/></div>
            <div class="col-md-6"><label>Descrição interna</label><textarea class="form-control" name="descricao" id="crud-descricao" rows="2" placeholder="Opcional"></textarea></div>
            <div class="col-md-3"><label>Status</label><select class="form-select" name="ativo" id="crud-ativo"><option value="1">Ativo</option><option value="0">Inativo</option></select></div>
        </div>
        <hr class="my-3"/>
        <div class="d-flex justify-content-between align-items-center mb-2">
            <label class="form-label mb-0">Resíduos do plano <small class="text-muted">(saldo, excedente ou crédito reciclável)</small></label>
            <button type="button" class="btn btn-sm btn-outline-primary" id="btn-add-plano-item"><i class="fas fa-plus"></i> Adicionar resíduo</button>
        </div>
        <div class="table-responsive">
            <table class="table table-sm table-bordered mb-0" id="plano-itens-table">
                <thead class="table-light"><tr>
                    <th style="min-width:240px">Resíduo</th>
                    <th style="width:100px">Saldo (kg)</th>
                    <th style="width:120px">Valor (R$/kg)</th>
                    <th style="width:110px" class="text-center" title="Reciclável: desconto = kg coletados × tarifa (ignora saldo)">Gera crédito</th>
                    <th style="width:120px" class="text-center" title="Vários resíduos somam o saldo incluso quando têm o mesmo valor excedente">Saldo compartilhado</th>
                    <th style="width:50px"></th>
                </tr></thead>
                <tbody id="plano-itens-body"></tbody>
            </table>
        </div>
        <template id="tpl-tipo-options">{{tipos_residuos_options}}</template>
    </form></div>
    <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-primary" onclick="salvarPlano()">Salvar</button></div>
</div></div></div>
