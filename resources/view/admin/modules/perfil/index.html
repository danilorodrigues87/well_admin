<h1 class="mt-2">Meu Perfil</h1>
<ol class="breadcrumb mb-4">
    <li class="breadcrumb-item"><a href="{{URL}}/painel">Dashboard</a></li>
    <li class="breadcrumb-item active">Perfil</li>
</ol>

{{msg_alert}}

<div class="row">
    <div class="col-lg-6 mb-4">
        <div class="card">
            <div class="card-header"><i class="fas fa-user me-1"></i> Dados pessoais</div>
            <div class="card-body">
                <form method="post" action="{{URL}}/painel/perfil">
                    {{csrf_field}}
                    <input type="hidden" name="acao" value="dados"/>
                    <div class="mb-3">
                        <label class="form-label">Nome</label>
                        <input type="text" name="nome" class="form-control" value="{{nome}}" required maxlength="120"/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">E-mail</label>
                        <input type="email" name="email" class="form-control" value="{{email}}" required maxlength="180"/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Função</label>
                        <input type="text" class="form-control" value="{{funcao}}" disabled readonly/>
                    </div>
                    <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i> Salvar dados</button>
                </form>
            </div>
        </div>
    </div>
    <div class="col-lg-6 mb-4">
        <div class="card">
            <div class="card-header"><i class="fas fa-lock me-1"></i> Trocar senha</div>
            <div class="card-body">
                <form method="post" action="{{URL}}/painel/perfil">
                    {{csrf_field}}
                    <input type="hidden" name="acao" value="senha"/>
                    <div class="mb-3">
                        <label class="form-label">Senha atual</label>
                        <input type="password" name="senha_atual" class="form-control" required autocomplete="current-password"/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nova senha</label>
                        <input type="password" name="nova_senha" class="form-control" required minlength="8" autocomplete="new-password"/>
                        <div class="form-text">Mínimo 8 caracteres.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Confirmar nova senha</label>
                        <input type="password" name="confirmar_senha" class="form-control" required minlength="8" autocomplete="new-password"/>
                    </div>
                    <button type="submit" class="btn btn-warning"><i class="fas fa-key me-1"></i> Alterar senha</button>
                </form>
            </div>
        </div>
    </div>
</div>
