<h1 class="mt-2">Coletas</h1>
<ol class="breadcrumb mb-4"><li class="breadcrumb-item"><a href="{{URL}}/painel">Dashboard</a></li><li class="breadcrumb-item active">Coletas</li></ol>
<div class="card mb-4">
    <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
        <span><i class="fas fa-truck me-1"></i> Coletas</span>
        <a href="{{URL}}/painel/coleta/nova" class="btn btn-primary btn-sm flex-shrink-0"><i class="fas fa-plus"></i> Nova coleta</a>
    </div>
    <div class="card-body">
        <div id="barra-filtros-lista" class="row mb-3 crud-filters-row g-2 align-items-end">
            <div class="col-md-4 col-lg-3">
                <label class="form-label small mb-0">Busca</label>
                <input type="text" id="crud-busca" name="busca" class="form-control" placeholder="MTR, cliente, CNPJ..." />
            </div>
            <div class="col-md-2 col-lg-2">
                <label class="form-label small mb-0">De</label>
                <input type="date" name="data_inicio" class="form-control crud-filter" value="{{data_inicio}}" />
            </div>
            <div class="col-md-2 col-lg-2">
                <label class="form-label small mb-0">Até</label>
                <input type="date" name="data_fim" class="form-control crud-filter" value="{{data_fim}}" />
            </div>
            <div class="col-md-3 col-lg-2">
                <label class="form-label small mb-0">Status</label>
                <select name="status" class="form-select crud-filter">
                    <option value="">Status: todos</option>
                    <option value="finalizada">Finalizadas</option>
                    <option value="rascunho">Rascunhos</option>
                </select>
            </div>
            <div class="col-md-3 col-lg-2">
                <label class="form-label small mb-0">Recebimento</label>
                <select name="situacao_recebimento" class="form-select crud-filter">
                    <option value="">Recebimento: todos</option>
                    <option value="recebido">Recebido</option>
                    <option value="pendente">Pendente</option>
                </select>
            </div>
            <div class="col-md-auto d-flex align-items-end pb-1">
                <button type="button" class="btn btn-outline-secondary btn-limpar-filtros" title="Limpar filtros">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>
        <form id="crud-form" class="d-none">{{csrf_field}}</form>
        <table class="table table-striped">
            <thead><tr><th>MTR</th><th>Cliente</th><th>Data</th><th>Coletor</th><th>Status</th><th>SINIR</th><th>Ações</th></tr></thead>
            <tbody id="crud-tbody"></tbody>
        </table>
        <div id="crud-pagination"></div>
    </div>
</div>
<div class="modal fade" id="detalheModal"><div class="modal-dialog modal-xl"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Detalhe da coleta</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body" id="detalhe-body"></div>
</div></div></div>
