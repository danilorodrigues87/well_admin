<h1 class="mt-2">Coletas / MTR</h1>
<ol class="breadcrumb mb-4"><li class="breadcrumb-item"><a href="{{URL}}/painel">Dashboard</a></li><li class="breadcrumb-item active">Coletas</li></ol>
<div class="card mb-4">
    <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
        <span><i class="fas fa-truck me-1"></i> Coletas / MTR</span>
        <a href="{{URL}}/painel/coleta/nova" class="btn btn-primary btn-sm flex-shrink-0"><i class="fas fa-plus"></i> Nova coleta</a>
    </div>
    <div class="card-body">
        <div id="barra-filtros-lista" class="row mb-3 crud-filters-row g-2 align-items-end">
            <div class="col-md-4 col-lg-3">
                <label class="form-label small mb-0">Busca</label>
                <input type="text" id="crud-busca" name="busca" class="form-control" placeholder="MTR, cliente, CNPJ..." />
            </div>
            <div class="col-md-2 col-lg-2">
                <label class="form-label small mb-0">De</label>
                <input type="date" name="data_inicio" class="form-control crud-filter" />
            </div>
            <div class="col-md-2 col-lg-2">
                <label class="form-label small mb-0">Até</label>
                <input type="date" name="data_fim" class="form-control crud-filter" />
            </div>
            <div class="col-md-3 col-lg-2">
                <label class="form-label small mb-0">Status</label>
                <select name="status" class="form-select crud-filter">
                    <option value="">Status: todos</option>
                    <option value="finalizada">Finalizadas</option>
                    <option value="rascunho">Rascunhos</option>
                </select>
            </div>
            <div class="col-md-3 col-lg-2">
                <label class="form-label small mb-0">Recebimento</label>
                <select name="situacao_recebimento" class="form-select crud-filter">
                    <option value="">Recebimento: todos</option>
                    <option value="recebido">Recebido</option>
                    <option value="pendente">Pendente</option>
                </select>
            </div>
        </div>
        <form id="crud-form" class="d-none">{{csrf_field}}</form>
        <table class="table table-striped">
            <thead><tr><th>MTR</th><th>Cliente</th><th>Data</th><th>Coletor</th><th>Status</th><th>SINIR</th><th>Ações</th></tr></thead>
            <tbody id="crud-tbody"></tbody>
        </table>
        <div id="crud-pagination"></div>
    </div>
</div>
<div class="modal fade" id="detalheModal"><div class="modal-dialog modal-xl"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Detalhe da coleta</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body" id="detalhe-body"></div>
</div></div></div>
<script>
window.sinirReenviar = function (id) {
    var csrf = document.querySelector('#crud-form input[name="_csrf"]');
    var postUrl = (typeof url_base !== 'undefined' ? url_base : '/').replace(/\/+$/, '') + '/painel/coletas';
    var doPost = function () {
        $.post(postUrl, { acao: 'sinir_reenviar', id: id, _csrf: csrf ? csrf.value : '' }, function (d) {
            d = typeof d === 'object' ? d : JSON.parse(d);
            if (d.success) {
                if (typeof Swal !== 'undefined') { Swal.fire('SINIR', d.message || 'Enviado.', 'success'); } else { alert(d.message || 'Enviado.'); }
                window.detalhar(id);
                if (typeof carregarLista === 'function') { carregarLista(); }
            } else if (typeof Swal !== 'undefined') { Swal.fire('Erro SINIR', d.message || 'Erro', 'error'); } else { alert(d.message || 'Erro'); }
        }, 'json');
    };
    if (typeof Swal !== 'undefined') {
        Swal.fire({ title: 'Reenviar ao SINIR?', text: 'Será emitido um novo manifesto nacional.', icon: 'question', showCancelButton: true, confirmButtonText: 'Reenviar' }).then(function (r) { if (r.isConfirmed) { doPost(); } });
    } else if (confirm('Reenviar ao SINIR?')) { doPost(); }
};
window.detalhar = function (id) {
    var csrf = document.querySelector('#crud-form input[name="_csrf"]');
    $.post((typeof url_base !== 'undefined' ? url_base : '/').replace(/\/+$/, '') + '/painel/coletas', {
        acao: 'get', id: id, _csrf: csrf ? csrf.value : ''
    }, function (d) {
        d = typeof d === 'object' ? d : JSON.parse(d);
        if (d.success && d.html) {
            $('#detalhe-body').html(d.html);
            bootstrap.Modal.getOrCreateInstance(document.getElementById('detalheModal')).show();
        } else if (typeof Swal !== 'undefined') { Swal.fire('Erro', d.message || 'Erro', 'error'); } else { alert(d.message || 'Erro'); }
    }, 'json');
};
</script>
