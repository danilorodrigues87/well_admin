<h1 class="mt-2">Destinadores</h1>
<ol class="breadcrumb mb-4"><li class="breadcrumb-item"><a href="{{URL}}/painel">Dashboard</a></li><li class="breadcrumb-item active">Destinadores</li></ol>
<div class="card mb-4">
    <div class="card-header d-flex justify-content-between"><span><i class="fas fa-industry me-1"></i> Cadastro</span><button class="btn btn-primary btn-sm" onclick="novoRegistro()"><i class="fas fa-plus"></i> Novo</button></div>
    <div class="card-body">
        <div id="barra-filtros-lista" class="row mb-3 crud-filters-row g-2">
            <div class="col-md-4"><input type="text" id="crud-busca" name="busca" class="form-control" placeholder="Buscar nome, CNPJ…" /></div>
            <div class="col-md-2"><select name="ativo" class="form-select crud-filter"><option value="">Ativos</option><option value="1">Somente ativos</option><option value="0">Somente inativos</option></select></div>
        </div>
        <table class="table table-striped"><thead><tr><th>Nome</th><th>CNPJ</th><th>Unidade SINIR</th><th>Ações</th></tr></thead><tbody id="crud-tbody"></tbody></table>
        <div id="crud-pagination"></div>
    </div>
</div>
<div class="modal fade" id="crudModal"><div class="modal-dialog modal-lg"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Destinador</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body"><form id="crud-form">{{csrf_field}}<input type="hidden" name="id" id="crud-id" value="0"/>
        <div class="mb-2"><label>Nome</label><input class="form-control" name="nome" id="crud-nome" required/></div>
        <div class="mb-2"><label>CNPJ</label><input class="form-control" name="cnpj" id="crud-cnpj" required/></div>
        <div class="mb-2"><label>Endereço</label><input class="form-control" name="endereco" id="crud-endereco"/></div>
        <div class="row"><div class="col-md-6 mb-2"><label>Telefone</label><input class="form-control" name="telefone" id="crud-telefone"/></div>
        <div class="col-md-6 mb-2"><label>Responsável</label><input class="form-control" name="responsavel" id="crud-responsavel"/></div></div>
        <div class="mb-2"><label>Cód. unidade SINIR</label><input class="form-control" name="sinir_cod_unidade" id="crud-sinir_cod_unidade" type="number" min="1"/></div>
        <div class="mb-2"><label>Status</label><select class="form-select" name="ativo" id="crud-ativo"><option value="1">Ativo</option><option value="0">Inativo</option></select></div>
    </form></div>
    <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-primary" onclick="salvarRegistro()">Salvar</button></div>
</div></div></div>
