<h1 class="mt-2">Grupos de Resíduo</h1>
<ol class="breadcrumb mb-4"><li class="breadcrumb-item"><a href="{{URL}}/painel">Dashboard</a></li><li class="breadcrumb-item active">Grupos de Resíduo</li></ol>
<div class="card mb-4">
    <div class="card-header d-flex justify-content-between"><span><i class="fas fa-tags me-1"></i> Grupos por classe</span><button class="btn btn-primary btn-sm" onclick="novoRegistro()"><i class="fas fa-plus"></i> Novo grupo</button></div>
    <div class="card-body">
        <div id="barra-filtros-lista" class="row mb-3 crud-filters-row g-2">
            <div class="col-md-4"><input type="text" id="crud-busca" name="busca" class="form-control" placeholder="Buscar classe, código..." /></div>
            <div class="col-md-3"><select name="classe_id" class="form-select crud-filter">{{classes_filter_options}}</select></div>
        </div>
        <table class="table table-striped"><thead><tr><th>Classe</th><th>Código</th><th>Nome</th><th>Ações</th></tr></thead><tbody id="crud-tbody"></tbody></table>
        <div id="crud-pagination"></div>
    </div>
</div>
<div class="modal fade" id="crudModal"><div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Grupo de resíduo</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body"><form id="crud-form">{{csrf_field}}<input type="hidden" name="id" id="crud-id" value="0"/>
        <div class="mb-2"><label>Classe *</label><select class="form-select" name="classe_id" id="crud-classe_id" required>{{classes_options}}</select></div>
        <div class="mb-2"><label>Código *</label><input class="form-control" name="codigo" id="crud-codigo" maxlength="10" required placeholder="Ex: A, B, E"/></div>
        <div class="mb-2"><label>Nome</label><input class="form-control" name="nome" id="crud-nome"/></div>
        <div class="mb-2"><label>Descrição</label><textarea class="form-control" name="descricao" id="crud-descricao" rows="2"></textarea></div>
        <div class="mb-2"><label>Status</label><select class="form-select" name="ativo" id="crud-ativo"><option value="1">Ativo</option><option value="0">Inativo</option></select></div>
    </form></div>
    <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-primary" onclick="salvarRegistro()">Salvar</button></div>
</div></div></div>
