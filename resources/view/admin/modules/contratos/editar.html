<div class="container-fluid px-4">
    <h1 class="mt-4">Personalizar contrato {{numero}}</h1>
    {{alerta}}
    <p class="text-muted">Mensalidade negociada neste contrato. Franquia e excedente vêm do plano, apenas para os resíduos marcados abaixo.</p>
    <form method="post" action="{{URL}}/painel/contratos/{{contrato_id}}/editar" class="card shadow p-4" id="form_contrato_editar">
        {{csrf_field}}
        <input type="hidden" name="return" value="{{return_path}}">
        <div class="row g-3">
            <div class="col-12">
                <h2 class="h6">Resíduos deste gerador</h2>
                <div id="itens_plano_editar"></div>
            </div>
            <div class="col-md-3">
                <label class="form-label">Valor mensal (R$) *</label>
                <input type="text" name="valor_mensal" class="form-control" value="{{valor_mensal}}" required>
            </div>
            <div class="col-md-3">
                <label class="form-label">Taxa adesão (R$)</label>
                <input type="text" name="taxa_adesao" class="form-control" value="{{taxa_adesao}}">
            </div>
            <div class="col-md-3">
                <label class="form-label">Índice reajuste</label>
                <input type="text" name="indice_reajuste" class="form-control" value="{{indice_reajuste}}">
            </div>
            <div class="col-md-3">
                <label class="form-label">Meses vigência</label>
                <input type="number" name="qtd_meses" class="form-control" value="{{qtd_meses}}" min="1" max="120">
            </div>
            <div class="col-md-4">
                <label class="form-label">Início</label>
                <input type="date" name="data_inicio" class="form-control" value="{{data_inicio}}">
            </div>
            <div class="col-md-4">
                <label class="form-label">Dia vencimento</label>
                <input type="number" name="dia_vencimento" class="form-control" value="{{dia_vencimento}}" min="1" max="28">
            </div>
            <div class="col-md-4">
                <label class="form-label">Foro (cidade / UF)</label>
                <div class="input-group">
                    <input type="text" name="foro_cidade" class="form-control" value="{{foro_cidade}}">
                    <input type="text" name="foro_uf" class="form-control" maxlength="2" style="max-width:4rem" value="{{foro_uf}}">
                </div>
            </div>
            <div class="col-12">
                <label class="form-label">Frequência de coleta (texto livre)</label>
                <input type="text" name="frequencia_coleta" class="form-control" value="{{frequencia_coleta}}" placeholder="Ex.: mensalmente, 2x por mês…">
            </div>
            <div class="col-12">
                <label class="form-label">Promoção / desconto (HTML opcional)</label>
                <textarea name="promocao_html" class="form-control font-monospace" rows="3">{{promocao_html}}</textarea>
            </div>
            <div class="col-12">
                <label class="form-label">Cláusulas extras (texto)</label>
                <textarea name="clausulas_extra_html" class="form-control" rows="3">{{clausulas_extra_html}}</textarea>
            </div>
            <div class="col-12">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="atualizar_snapshot" value="1" id="atualizar_snapshot" checked>
                    <label class="form-check-label" for="atualizar_snapshot">Atualizar tarifas do plano nos resíduos marcados ao salvar</label>
                </div>
            </div>
            <div class="col-12">
                <div class="card bg-light">
                    <div class="card-body">
                        <strong>Resumo atual (valores acordados)</strong>
                        {{snapshot_itens}}
                    </div>
                </div>
            </div>
        </div>
        <div class="mt-4 d-flex flex-wrap gap-2">
            <button type="submit" class="btn btn-primary">Salvar personalização</button>
            <a href="{{voltar_url}}" class="btn btn-outline-secondary">Voltar</a>
        </div>
    </form>
    <form method="post" action="{{URL}}/painel/contratos/{{contrato_id}}/editar" class="mt-3">
        {{csrf_field}}
        <input type="hidden" name="return" value="{{return_path}}">
        <input type="hidden" name="recarregar_snapshot" value="1">
        <button type="submit" class="btn btn-sm btn-outline-primary">Recarregar tarifas do plano (mantém resíduos selecionados)</button>
    </form>
</div>
<script src="{{URL}}/resources/js/contrato-wizard.js"></script>
<script>
initContratoItensEditor({
    url: '{{URL}}/painel/contratos/plano-itens',
    planoId: {{plano_id}},
    prefillRaw: {{prefill_tipo_ids}},
    itensHost: '#itens_plano_editar',
    form: '#form_contrato_editar'
});
</script>
