<div class="container-fluid px-4">
    <h1 class="mt-4">Contratos — {{cliente_nome}}</h1>
    <div class="mb-3 d-flex flex-wrap gap-2">
        <a href="{{voltar_lista_url}}" class="btn btn-outline-secondary"><i class="fas fa-arrow-left me-1"></i> Listagem com filtros</a>
        <a href="{{URL}}/painel/clientes/{{cliente_id}}/contrato/novo?return={{return_path_encoded}}" class="btn btn-primary"><i class="fas fa-plus me-1"></i> Novo contrato</a>
    </div>
    <div class="card shadow">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead><tr><th>Número</th><th>Plano</th><th>Status</th><th></th></tr></thead>
                <tbody>{{rows}}</tbody>
            </table>
        </div>
    </div>
</div>
