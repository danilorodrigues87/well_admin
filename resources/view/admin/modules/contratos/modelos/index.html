<div class="container-fluid px-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center mt-4 mb-3 gap-2">
        <div>
            <h1 class="mb-1">Modelos jurídicos de contrato</h1>
            <p class="text-muted mb-0">Textos HTML por operadora. Planos referenciam o <code>slug</code> (tipo de modelo).</p>
        </div>
        <div>
            <a href="{{URL}}/painel/contratos" class="btn btn-outline-secondary">Voltar aos contratos</a>
            <form method="post" action="{{URL}}/painel/contratos/modelos/reimportar" class="d-inline">
                {{csrf_reimport}}
                <button type="submit" class="btn btn-outline-primary" onclick="return confirm('Reimportar do seed sobrescreve títulos e corpos dos slugs existentes. Continuar?');">Reimportar seed</button>
            </form>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-8">
            <div class="card shadow">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead><tr><th>Slug</th><th>Nome</th><th>Versão</th><th>Preço</th><th></th><th></th></tr></thead>
                        <tbody>{{rows}}</tbody>
                    </table>
                </div>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="card shadow">
                <div class="card-header bg-white">Placeholders</div>
                <div class="card-body">{{placeholders_help}}</div>
            </div>
        </div>
    </div>
</div>
