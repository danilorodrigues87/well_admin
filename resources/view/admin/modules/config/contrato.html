<div class="container-fluid px-4">
    <h1 class="mt-4">Modelo de contrato</h1>
    <p class="text-muted">HTML com placeholders: {{contratada}}, {{contratante}}, {{plano}}, {{clausula_1}}, etc.</p>
    <form method="post" action="{{URL}}/painel/config/contrato">
        {{csrf_field}}
        <textarea name="modelo_html" class="form-control font-monospace mb-3" rows="18">{{modelo_html}}</textarea>
        <button type="submit" class="btn btn-primary">Salvar</button>
        <button type="submit" name="acao" value="restaurar" class="btn btn-outline-secondary">Restaurar padrão</button>
    </form>
</div>
