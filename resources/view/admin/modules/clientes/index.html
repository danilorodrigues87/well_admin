<h1 class="mt-2">Clientes</h1>
<ol class="breadcrumb mb-4"><li class="breadcrumb-item"><a href="{{URL}}/painel">Dashboard</a></li><li class="breadcrumb-item active">Clientes</li></ol>
<div class="card mb-4">
    <div class="card-header d-flex justify-content-between"><span><i class="fas fa-building me-1"></i> Clientes</span><button class="btn btn-primary btn-sm" onclick="novoRegistro()"><i class="fas fa-plus"></i> Novo cliente</button></div>
    <div class="card-body">
        <div id="barra-filtros-lista" class="row mb-3 crud-filters-row g-2">
            <div class="col-md-4"><input type="text" id="crud-busca" name="busca" class="form-control" placeholder="Buscar nome, CNPJ, cidade..." /></div>
            <div class="col-md-2"><select name="status" class="form-select crud-filter"><option value="">Status: todos</option><option value="ativo">Ativo</option><option value="suspenso">Suspenso</option><option value="inativo">Inativo</option></select></div>
            <div class="col-md-3"><select name="plano_id" class="form-select crud-filter"><option value="">Plano: todos</option>{{planos_options}}</select></div>
            <div class="col-md-2"><select name="prioridade" class="form-select crud-filter"><option value="">Prioridade: todas</option><option value="normal">Normal</option><option value="urgente">Urgente</option></select></div>
        </div>
        <table class="table table-striped"><thead><tr><th>Nome fantasia</th><th>CNPJ</th><th>Cidade</th><th>Plano</th><th>Status</th><th>Ações</th></tr></thead><tbody id="crud-tbody"></tbody></table>
        <div id="crud-pagination"></div>
    </div>
</div>
<div class="modal fade" id="crudModal"><div class="modal-dialog modal-xl"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Cliente</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body"><form id="crud-form">{{csrf_field}}<input type="hidden" name="id" id="crud-id" value="0"/>
        <div class="row">
            <div class="col-md-6 mb-2"><label>Nome fantasia *</label><input class="form-control" name="nome_fantasia" id="crud-nome_fantasia" required/></div>
            <div class="col-md-6 mb-2"><label>Razão social *</label><input class="form-control" name="razao_social" id="crud-razao_social" required/></div>
            <div class="col-md-4 mb-2"><label>CNPJ</label><input class="form-control" name="cnpj" id="crud-cnpj"/></div>
            <div class="col-md-4 mb-2"><label>E-mail</label><input class="form-control" name="email" id="crud-email" type="email"/></div>
            <div class="col-md-4 mb-2"><label>Telefone</label><input class="form-control" name="telefone" id="crud-telefone"/></div>
            <div class="col-md-6 mb-2"><label>Plano</label><select class="form-select" name="plano_id" id="crud-plano_id">{{planos_options_modal}}</select></div>
            <div class="col-md-6 mb-2"><label>Status</label><select class="form-select" name="status" id="crud-status"><option value="ativo">Ativo</option><option value="suspenso">Suspenso</option><option value="inativo">Inativo</option></select></div>
            <div class="col-12"><hr><strong>Endereço</strong></div>
            <div class="col-md-6 mb-2"><label>Logradouro</label><input class="form-control" name="logradouro" id="crud-logradouro"/></div>
            <div class="col-md-2 mb-2"><label>Nº</label><input class="form-control" name="numero" id="crud-numero"/></div>
            <div class="col-md-4 mb-2"><label>Bairro</label><input class="form-control" name="bairro" id="crud-bairro"/></div>
            <div class="col-md-3 mb-2"><label>CEP</label><input class="form-control" name="cep" id="crud-cep"/></div>
            <div class="col-md-6 mb-2"><label>Cidade</label><input class="form-control" name="cidade" id="crud-cidade"/></div>
            <div class="col-md-3 mb-2"><label>UF</label><input class="form-control" name="uf" id="crud-uf" maxlength="2"/></div>
            <div class="col-12"><hr><strong>Responsável</strong></div>
            <div class="col-md-6 mb-2"><label>Nome</label><input class="form-control" name="responsavel" id="crud-responsavel"/></div>
            <div class="col-md-6 mb-2"><label>Telefone</label><input class="form-control" name="telefone_resp" id="crud-telefone_resp"/></div>
        </div>
    </form></div>
    <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-primary" onclick="salvarRegistro()">Salvar</button></div>
</div></div></div>
