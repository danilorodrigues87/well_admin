<h1 class="mt-2">Agendamentos</h1>
<ol class="breadcrumb mb-4"><li class="breadcrumb-item"><a href="{{URL}}/painel">Dashboard</a></li><li class="breadcrumb-item active">Agendamentos</li></ol>
<div class="card mb-4">
    <div class="card-header"><i class="fas fa-calendar me-1"></i> Próximas coletas por cliente</div>
    <div class="card-body">
        <div id="barra-filtros-lista" class="row mb-3 crud-filters-row g-2">
            <div class="col-md-4"><input type="text" id="crud-busca" name="busca" class="form-control" placeholder="Buscar cliente..."/></div>
            <div class="col-md-3"><select name="rota_id" class="form-select crud-filter">{{rotas_options}}</select></div>
            <div class="col-md-2"><select name="prioridade" class="form-select crud-filter"><option value="">Prioridade: todas</option><option value="normal">Normal</option><option value="urgente">Urgente</option></select></div>
        </div>
        <table class="table table-striped"><thead><tr><th>Cliente</th><th>Plano</th><th>Cidade</th><th>Próxima coleta</th><th>Saldo plano</th><th>Ações</th></tr></thead>
        <tbody id="crud-tbody"></tbody></table>
        <div id="crud-pagination"></div>
    </div>
</div>
<div class="modal fade" id="crudModal"><div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Agendar coleta</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body"><form id="crud-form">{{csrf_field}}<input type="hidden" name="id" id="crud-id"/>
        <p id="crud-nome-label" class="fw-bold"></p>
        <p id="crud-plano-info" class="small text-muted mb-3"></p>
        <div class="mb-2"><label>Próxima coleta</label><input type="date" class="form-control" name="proxima_coleta" id="crud-proxima_coleta"/></div>
        <div class="mb-2"><label>Prioridade</label><select class="form-select" name="prioridade" id="crud-prioridade"><option value="normal">Normal</option><option value="urgente">Urgente</option></select></div>
    </form></div>
    <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-primary" onclick="salvarRegistro()">Salvar</button></div>
</div></div></div>
