<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <link rel="icon" href="{{URL}}/resources/assets/imgs/favicon.png" type="image/png" />
    <link href="{{URL}}/resources/css/styles.css" rel="stylesheet" />
    <link href="{{URL}}/resources/css/panel-theme.css" rel="stylesheet" />
    <style>:root { --well-login-bg-image: url('{{URL}}/resources/assets/imgs/bg-well.png'); }</style>
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <script>var url_base = '{{URL}}/';</script>
</head>
<body class="well-login-page">
    <div id="layoutAuthentication">
        <div id="layoutAuthentication_content">
            <main>
                <div class="container">
                    <div class="row justify-content-center">
                        {{content}}
                    </div>
                </div>
            </main>
        </div>
        <div id="layoutAuthentication_footer">
            <footer class="py-4 mt-auto">
                <div class="container-fluid px-4">
                    <div class="small text-muted text-center">
                        &copy; {{company_name}}
                        <span class="mx-1">·</span>
                        <a href="{{URL}}/privacidade" class="text-decoration-none link-light link-opacity-75">Privacidade</a>
                        <span class="mx-1">·</span>
                        <a href="{{URL}}/" class="text-decoration-none link-light link-opacity-75">Admin</a>
                    </div>
                </div>
            </footer>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
